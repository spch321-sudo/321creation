<style>
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E8EAF1; --ink:#1A2233; --muted:#586177; --line:#D5D9E3;
  --accent:#2C5A9C; --accent-soft:rgba(44,90,156,.10); --red:#B94A30; --red-soft:rgba(185,74,48,.10);
  --good:#2E7D4F; --good-soft:rgba(46,125,79,.12); --warn:#9A6B00; --warn-soft:rgba(154,107,0,.13); --crit:#B4561C; --crit-soft:rgba(180,86,28,.13);
  --hl-gold:#F5E6C4;--hl-green:#DDEFD9;--hl-blue:#DCE7F7;--hl-pink:#FADDE4;--hl-purple:#E8DEF4;--hl-maroon:#F0DADA;--hl-brown:#EEE1CD;--hl-charcoal:#E3E2DE;--reading:#D6E3F7;
  --night1:#0F1628; --night2:#1C2A4A; --star:#F4E9C8;
  --fs:17px;
  --serif:"Noto Serif TC","PMingLiU","Songti TC",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1220; --surface:#151C2D; --sunk:#1C2438; --ink:#E6E9F1; --muted:#A1A9BC; --line:#2B3550;
    --accent:#8DB1EE; --accent-soft:rgba(141,177,238,.14); --red:#EE8A6C; --red-soft:rgba(238,138,108,.14);
    --good:#74C795; --good-soft:rgba(116,199,149,.14); --warn:#E1B652; --warn-soft:rgba(225,182,82,.14); --crit:#EE9A62; --crit-soft:rgba(238,154,98,.15);
    --hl-gold:#3D3218;--hl-green:#1F3320;--hl-blue:#1E2C44;--hl-pink:#3E2330;--hl-purple:#2F2640;--hl-maroon:#3A2222;--hl-brown:#39301F;--hl-charcoal:#2E2E2B;--reading:#26395A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1220; --surface:#151C2D; --sunk:#1C2438; --ink:#E6E9F1; --muted:#A1A9BC; --line:#2B3550;
  --accent:#8DB1EE; --accent-soft:rgba(141,177,238,.14); --red:#EE8A6C; --red-soft:rgba(238,138,108,.14);
  --good:#74C795; --good-soft:rgba(116,199,149,.14); --warn:#E1B652; --warn-soft:rgba(225,182,82,.14); --crit:#EE9A62; --crit-soft:rgba(238,154,98,.15);
  --hl-gold:#3D3218;--hl-green:#1F3320;--hl-blue:#1E2C44;--hl-pink:#3E2330;--hl-purple:#2F2640;--hl-maroon:#3A2222;--hl-brown:#39301F;--hl-charcoal:#2E2E2B;--reading:#26395A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.75;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;line-height:1.35;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.1em;letter-spacing:.08em}
.brand small{font-family:var(--sans);font-weight:400;font-size:.62em;color:var(--muted);letter-spacing:.04em;margin-left:8px}
.top .sp{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.8em;color:var(--muted)}
.proto{font-size:.72em;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 8px;letter-spacing:.04em}

/* hero */
.hero{margin-block:20px 8px;padding:28px 22px 22px;border-radius:14px;color:#EEF1F8;background:radial-gradient(120% 90% at 85% 0%,var(--night2) 0%,var(--night1) 70%);position:relative;overflow:hidden}
.hero h1{font-size:2.1em;letter-spacing:.12em;color:#fff}
.hero .v{font-family:var(--serif);font-size:1em;line-height:1.9;margin:14px 0 4px;color:#E3E7F2;max-width:32em}
.hero cite{font-style:normal;font-size:.8em;color:#AAB4CC}
.spec{margin-top:18px;height:14px;border-radius:3px;position:relative;background:linear-gradient(90deg,#5b2ca0,#2f5fe0 16%,#22b3d8 30%,#3fcf6a 45%,#e8e04a 60%,#f39a2d 75%,#d63a2a 92%)}
.spec i{position:absolute;top:0;bottom:0;width:2px;background:rgba(10,12,20,.85)}
.speclbl{display:flex;justify-content:space-between;font-size:.7em;color:#AAB4CC;margin-top:6px;letter-spacing:.06em}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.8}

.sec{margin-top:30px}
.sec h2{font-size:1.2em;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.sec h2 span{font-family:var(--sans);font-weight:400;font-size:.68em;color:var(--muted)}
.halls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.halls{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hall{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:112px}
.hall b{font-family:var(--serif);font-size:1.05em}
.hall .d{font-size:.78em;color:var(--muted);line-height:1.5}
.hall .st{margin-top:auto;font-size:.72em;letter-spacing:.04em;color:var(--muted)}
.hall.open{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hall.open .st{color:var(--accent);font-weight:700}
.hall[disabled]{opacity:.62;cursor:default}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:10px}
.q .m{font-family:var(--serif);font-size:1.3em;color:var(--red);line-height:1}
.q .t{flex:1}
.q .s{font-size:.72em;color:var(--muted)}

/* unit */
.uhead{margin-top:18px}
.eyebrow{font-size:.74em;letter-spacing:.14em;color:var(--muted)}
.uhead h1{font-size:1.9em;margin-top:4px}
.uhead .sub{color:var(--muted);margin-top:4px;font-size:.92em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:.72em;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.depth{display:flex;margin-top:16px;background:var(--sunk);border-radius:10px;padding:3px}
.depth button{flex:1;background:none;border:0;border-radius:8px;padding:6px 4px;font-size:.84em;color:var(--muted)}
.depth button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.depth button small{display:block;font-size:.76em;font-weight:400;color:var(--muted)}
.steps{display:flex;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.steps button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px;font-size:.8em;color:var(--muted);white-space:nowrap}
.steps button .n{display:none}
@media (min-width:560px){.steps button{padding:8px 10px;font-size:.84em}.steps button .n{display:inline}}
.steps button .n{font-family:var(--mono);font-size:.8em;margin-right:4px}
.steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--red);font-weight:700}
.steps button.done{color:var(--accent)}
.body{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.body p{margin:0;max-width:36em}
.body h3{font-size:1.1em;margin-top:6px}
.body ul{margin:0;padding-left:1.3em}
.body li{margin:4px 0}
.dtag{font-size:.66em;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:2px}
.verse{margin:0;padding:14px 18px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0}
.verse p{font-family:var(--serif);line-height:1.95}
.verse cite{display:block;font-style:normal;font-size:.8em;color:var(--muted);margin-top:4px}
.analogy{padding:14px 16px;background:var(--sunk);border-radius:10px}
.lbl{display:inline-block;font-size:.7em;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.claim{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.chip{align-self:flex-start;font-size:.72em;font-weight:700;border-radius:4px;padding:1px 8px;letter-spacing:.04em}
.chip.c1{color:var(--good);background:var(--good-soft)}
.chip.c2{color:var(--warn);background:var(--warn-soft)}
.chip.c3{color:var(--crit);background:var(--crit-soft)}
.chip.c4{color:var(--accent);background:var(--accent-soft)}
details.refs{font-size:.8em;color:var(--muted)}
details.refs summary{cursor:pointer;color:var(--accent);width:max-content}
details.refs ol{margin:6px 0 0;padding-left:1.4em;line-height:1.6}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.views{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.views{grid-template-columns:1fr 1fr}}
.view{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.view b{font-family:var(--serif)}
.view p{font-size:.9em}
.sim{background:var(--night1);border-radius:12px;padding:12px;color:#E3E7F2}
.sim canvas{width:100%;aspect-ratio:16/10;display:block;border-radius:8px;max-width:100%}
.simctl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.simctl input{flex:1;min-width:160px;accent-color:#EE8A6C}
.simctl .num{font-size:.85em;color:#F4E9C8;min-width:9.5em}
.simbtn{background:#EE8A6C;color:#1A1208;border:0;border-radius:999px;padding:5px 14px;font-size:.85em;font-weight:700}
.simnote{font-size:.74em;color:#AAB4CC;margin-top:6px}
.pray{padding:16px;border:1px dashed var(--line);border-radius:10px}
.pray p{font-family:var(--serif)}
.quiz{display:flex;flex-direction:column;gap:14px}
.qz{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.qz .qq{font-weight:700;margin-bottom:8px}
.qz button{display:block;width:100%;text-align:left;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:.92em}
.qz button.ok{border-color:var(--good);background:var(--good-soft)}
.qz button.no{border-color:var(--crit);background:var(--crit-soft)}
.qz .fb{font-size:.85em;color:var(--muted);margin-top:8px}
.sharebox img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.sharebox p{font-size:.82em;color:var(--muted);margin-top:6px}
.nav{display:flex;gap:10px;margin-top:26px}
.nav button{flex:1;border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.nav button.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.nav button[disabled]{opacity:.4;cursor:default}
.readbtn{display:inline-flex;align-items:center;gap:6px}

.dialbar{position:relative;height:18px;border-radius:9px;background:rgba(238,154,98,.35)}
.dialbar .win{position:absolute;left:0;top:0;bottom:0;width:2.1%;min-width:5px;background:#74C795;border-radius:9px 0 0 9px}
.dialbar .mk{position:absolute;top:-5px;width:4px;height:28px;margin-left:-2px;background:#F4E9C8;border-radius:2px}
.dialst{margin:10px 0 0;font-weight:700}
.scale .scn{font-family:var(--serif);font-size:1.8em;color:#fff}
.scale .scv{color:#E3E7F2}
.scale .scl{color:#F4E9C8;font-size:.9em;margin-top:2px}
.dots{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:30px}
.dots i{display:block;border-radius:50%;background:rgba(244,233,200,.18)}
.dots i.on{background:#EE8A6C}
.zonebar{position:relative;height:18px;border-radius:9px;overflow:visible;display:flex}
.zonebar .zin{width:30%;background:rgba(238,154,98,.45);border-radius:9px 0 0 9px}
.zonebar .zok{width:28%;background:#74C795}
.zonebar .zout{flex:1;background:linear-gradient(90deg,#B9D98C 0,#B9D98C 47.6%,rgba(141,177,238,.4) 47.6%);border-radius:0 9px 9px 0}
.zonebar .mk{position:absolute;top:-5px;width:4px;height:28px;margin-left:-2px;background:#F4E9C8;border-radius:2px}
.zlab{display:flex;justify-content:space-between;font-size:.72em;color:#AAB4CC;margin-top:4px;font-family:var(--mono)}
.steps button.sertab{color:var(--red);font-weight:700}
.sermon h2.stitle{font-size:1.45em;margin-top:4px}
.sermon h3.sh{font-size:1.15em;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sermon h4.ss{font-family:var(--serif);font-size:1em;margin:4px 0 0;color:var(--accent)}
.langs{display:flex;gap:2px;font-size:.78em}
.langs a{color:var(--muted);text-decoration:none;padding:3px 7px;border-radius:6px}
.langs a[aria-current="true"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
@media (max-width:560px){.brand small{display:none}.proto{display:none}}
:lang(en) .attr{grid-template-columns:8.6em 1fr 2.4em}
:lang(en) .hero h1{letter-spacing:.04em}

.blk{display:contents}
#stepBody .sent,#todayText .sent{cursor:pointer;border-radius:2px}
.sent[data-hl]{background:linear-gradient(transparent 55%,var(--hl-gold) 55%)}
.sent[data-color="green"]{background:linear-gradient(transparent 55%,var(--hl-green) 55%)}
.sent[data-color="blue"]{background:linear-gradient(transparent 55%,var(--hl-blue) 55%)}
.sent[data-color="pink"]{background:linear-gradient(transparent 55%,var(--hl-pink) 55%)}
.sent[data-color="purple"]{background:linear-gradient(transparent 55%,var(--hl-purple) 55%)}
.sent[data-color="maroon"]{background:linear-gradient(transparent 55%,var(--hl-maroon) 55%)}
.sent[data-color="brown"]{background:linear-gradient(transparent 55%,var(--hl-brown) 55%)}
.sent[data-color="charcoal"]{background:linear-gradient(transparent 55%,var(--hl-charcoal) 55%)}
.sent.tts-reading{box-shadow:inset 0 0 0 999px var(--reading);-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:box-shadow .2s}
.hl-note{margin:6px 0 0;padding:8px 12px;background:var(--sunk);border-left:3px solid #D9B168;border-radius:6px;font-size:.85em;white-space:pre-wrap;line-height:1.6}
.hl-note[data-color="green"]{border-left-color:#6FAE71}.hl-note[data-color="blue"]{border-left-color:#6C93D1}.hl-note[data-color="pink"]{border-left-color:#E58FA0}.hl-note[data-color="purple"]{border-left-color:#A48AC9}.hl-note[data-color="maroon"]{border-left-color:#8C4A4E}.hl-note[data-color="brown"]{border-left-color:#8A6740}.hl-note[data-color="charcoal"]{border-left-color:#54534E}
.hlsheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
.hlsheet-card{background:var(--surface);width:100%;max-width:720px;margin:0 auto;max-height:86vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.hlsheet-title{font-weight:700}
.hlsheet-quote{background:var(--hl-gold);border-radius:8px;padding:10px 12px;font-family:var(--serif);line-height:1.8}
.hlsheet-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hlsheet-label{font-size:.8em;color:var(--muted);min-width:2.5em}
.hlsheet-colors{display:flex;gap:10px;flex-wrap:wrap}
.hlswatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.hlswatch.active{border-color:var(--ink)}
.spanrow{display:flex;align-items:center;gap:8px}
.spanbtn{min-width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.spannum{font-size:.85em;color:var(--muted);min-width:3em;text-align:center}
.hl-hint{margin:0;font-size:.78em;color:var(--muted)}
.hlsheet-ta,.chatinput textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--sunk);color:var(--ink);resize:vertical}
.hlsheet-ta{min-height:84px}
.hlsheet-acts{display:flex;gap:8px}
.sbtn{flex:1;border-radius:10px;padding:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.sbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.sbtn.danger{color:var(--crit);border-color:var(--crit)}
.uitoast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.8em;padding:8px 16px;border-radius:999px;z-index:50;max-width:88vw;text-align:center}
.readbtn[data-state="playing"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.chatwrap{display:flex;flex-direction:column;gap:10px}
.chatctx{align-self:flex-start;font-size:.78em;color:var(--muted);background:var(--sunk);border-radius:999px;padding:4px 12px}
.qs-toggle{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:.82em;font-weight:700}
.qs-panel{border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:10px;display:flex;flex-direction:column;gap:6px}
.qs-chip{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.85em;line-height:1.5}
.chatlog{display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;line-height:1.8}
.msg.user{background:var(--accent);color:var(--bg);margin-left:auto;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai{background:var(--surface);border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:4px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin-bottom:0}
.msg.ai h4{margin:12px 0 4px;font-size:1em;color:var(--accent);font-family:var(--serif)}
.msg.ai blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0;font-family:var(--serif)}
.msg.ai ul{margin:4px 0 8px;padding-left:20px}.msg.ai li{margin-bottom:4px}
.msg.ai hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.msg.ai .mdtb{display:block;width:100%;overflow-x:auto;border-collapse:collapse;margin:10px 0;font-size:.88em}
.msg.ai .mdtb th,.msg.ai .mdtb td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.msg.ai .mdtb th{background:var(--sunk)}
.msg-actions{display:flex;gap:4px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.msg-act{border:none;background:transparent;color:var(--muted);font-size:.78em;padding:4px 8px;border-radius:999px}
.msg-act.on{color:var(--accent);font-weight:700}
.chatinput{display:flex;gap:8px;position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.chatinput textarea{resize:none;max-height:120px}
.chatinput button{border:none;background:var(--accent);color:var(--bg);border-radius:10px;padding:0 16px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.chatnote{margin:0;font-size:.74em}
.brandicon{width:30px;height:30px;border-radius:8px;flex:0 0 auto;margin-right:-4px}
.brand{white-space:nowrap}
:lang(en) .brand{letter-spacing:0;font-size:1em}
.diag p{margin:4px 0;font-size:.85em;font-family:var(--mono)}.diag .ok{color:var(--good)}.diag .bad{color:var(--crit)}

.msg-actions{flex-wrap:wrap}
.hllist{display:flex;flex-direction:column;gap:10px;margin-top:14px}

.hlbar{flex:0 0 5px;border-radius:3px}
.hlmeta{display:flex;flex-direction:column;gap:4px;min-width:0}
.hlsrc{font-size:.72em;color:var(--muted)}
.hlt{font-family:var(--serif);line-height:1.7}
.hln{font-size:.82em;background:var(--sunk);border-radius:6px;padding:4px 8px;white-space:pre-wrap}

.cardpv{background:var(--sunk);border-radius:12px;overflow:hidden;text-align:center}
.cardpv img{max-width:100%;max-height:48vh;display:block;margin:0 auto;-webkit-touch-callout:default;user-select:auto}
.cchips{display:flex;gap:6px;flex-wrap:wrap}
.cchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:.82em;font-weight:500}
.cchip.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

  function rng(seed) {
    var x = seed;
    return function () { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; };
  }

  function drawStars(cv) {
    var r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width)); cv.height = Math.max(1, Math.round(r.height));
    var c = cv.getContext('2d'), R = rng(7);
    for (var i = 0; i < 120; i++) {
      c.globalAlpha = 0.25 + R() * 0.6;
      c.fillStyle = '#F4E9C8';
      var s = R() < 0.9 ? 1 : 2;
      c.fillRect(R() * cv.width, R() * cv.height, s, s);
    }
  }

  /* ---------- rewind simulation ---------- */
  var GAL = null, playTimer = null;
  function initSim() {
    if (!GAL) {
      GAL = [];
      var R = rng(11);
      for (var i = 0; i < 180; i++) {
        var a = R() * Math.PI * 2, d = Math.sqrt(R());
        GAL.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 0.62, s: 0.6 + R() * 1.8, h: R() });
      }
    }
    var inp = $('simT');
    inp.oninput = function () { drawSim(inp.value / 1000); };
    $('simPlay').onclick = function () {
      if (playTimer) { return; }
      var v = inp.value > 20 ? +inp.value : 1000;
      playTimer = window.setInterval(function () {
        v -= 12;
        if (v <= 0) { v = 0; window.clearInterval(playTimer); playTimer = null; }
        inp.value = v; drawSim(v / 1000);
      }, 30);
    };
    drawSim(inp.value / 1000);
  }
  function drawSim(t) {
    var cv = $('simCv'); if (!cv) { return; }
    var c = cv.getContext('2d'), W = cv.width, H = cv.height, cx = W / 2, cy = H / 2;
    c.fillStyle = '#0F1628'; c.fillRect(0, 0, W, H);
    var sc = Math.max(t, 0.004), R = W * 0.47 * sc;
    var glow = t < 0.2 ? (0.2 - t) / 0.2 : 0;
    if (glow > 0) {
      var g = c.createRadialGradient(cx, cy, 0, cx, cy, W * 0.5);
      g.addColorStop(0, 'rgba(255,214,150,' + (0.95 * glow) + ')');
      g.addColorStop(0.35, 'rgba(238,138,108,' + (0.55 * glow) + ')');
      g.addColorStop(1, 'rgba(15,22,40,0)');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
    for (var i = 0; i < GAL.length; i++) {
      var p = GAL[i];
      var red = Math.round(170 + 85 * p.h * t), gr = Math.round(190 + 40 * (1 - p.h)), bl = Math.round(255 - 110 * p.h * t);
      c.fillStyle = 'rgb(' + red + ',' + gr + ',' + bl + ')';
      c.globalAlpha = 0.85;
      c.beginPath(); c.arc(cx + p.x * R, cy + p.y * R, p.s * (0.7 + 0.6 * t), 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
    var lbl = $('simLbl');
    if (lbl) {
      if (t >= 0.999) { lbl.textContent = '现在'; }
      else if (t <= 0.001) { lbl.textContent = '约 138 亿年前・开端'; }
      else { lbl.textContent = '往回约 ' + Math.round(138 * (1 - t)) + ' 亿年（示意）'; }
    }
  }

  /* ---------- share card ---------- */
  function wrapText(c, text, maxW) {
    var lines = [], cur = '';
    var toks = /[\u4e00-\u9fff]/.test(text) ? text.split('') : text.split(/(?=\s)/);
    for (var i = 0; i < toks.length; i++) {
      var ch = toks[i];
      if (!cur) { ch = ch.replace(/^\s+/, ''); }
      if (c.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch.replace(/^\s+/, ''); } else { cur += ch; }
    }
    if (cur) { lines.push(cur); }
    return lines;
  }
  function makeShare(img) {
    var U = cur();
    var cv = document.createElement('canvas'); cv.width = 1600; cv.height = 900;
    var c = cv.getContext('2d');

輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關     });

  async function hymnFetch(s) {
    const tries = songBase[s.f] != null ? [songBase[s.f]] : ['', 'music/'];
    let why = '';
    for (const b of tries) {
      try {
        const r = await fetch(SITE + b + encodeURIComponent(s.f), { mode: 'cors' });
        if (!r.ok) { why = 'HTTP ' + r.status; continue; }
        const blob = await r.blob();

        songBase[s.f] = b;
        return blob;

    }
    throw new Error(why || 'fail');

  /* ── 離開 App 再回來（或被系統重載）時接回原位：相機（10 分鐘內、且不在內嵌視窗）→ AI 配樂 → AI 生圖（12 小時內） ── */
  function resumeBoot() {
    let o = null, mode = '';
    if (!isFramed()) { o = lsTake('cam'); if (o && o.item && Date.now() - o.ts <= 10 * 60 * 1000) mode = 'cam'; else o = null; }
    if (!mode) { o = lsTake('mu'); if (o && o.item && Date.now() - o.ts <= 12 * 3600 * 1000) mode = 'mu'; else o = null; }
    if (!mode) { o = lsTake('ai'); if (o && o.item && Date.now() - o.ts <= 12 * 3600 * 1000) mode = 'ai'; else o = null; }
    if (!mode) return;
    let tries = 0;
    const iv = setInterval(() => {
      tries++;
      let ready = false;
      try { ready = !!(D && D.txt && S); } catch (e) { ready = false; }
      if (!ready) { if (tries > 40) clearInterval(iv); return; }

  /* ── iOS 分段 MP4 重新封裝（mx_*，照抄互動聖經，勿改）── */
function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }

}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }

function mx_parseTfhd(b,mx_box){

  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){

function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;

function mx_remux(bytes){

        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};

    const newTraks=[];

      const tkc=mx_children(b,tk);

  out.set(ftypBuf,p);p+=ftypBuf.length;
  out.set(moovNew,p);p+=moovNew.length;
  out.set(mdatHead,p);p+=16;

  async function toggleRec() {

    hymnStop(); stopTTS();

      try { selfieStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }); }
      catch (e) { recMode = 'c'; camFail(e); paint(); }
      if (recMode === 's') { paint(); attachSelfie(); await new Promise(r => setTimeout(r, 500)); }
    }
    let mic;
    try { mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch (e) {
      try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); }

    }

    let ac = null, bgmEl = null, bgmURL = null, audioStream = mic, micGain = null, bgmGain = null;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();

      const dst = ac.createMediaStreamDestination();
      micGain = ac.createGain(); micGain.gain.value = 0.0001;

      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}
      try { if (ac) ac.close(); } catch (_) {}

      await finishRec(new Blob(chunks, { type }), type, kind);

    chunks = []; recSec = 0;
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {

      try { if (bgmEl) { bgmEl.pause(); bgmEl.src = ''; } } catch (_) {}
      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}

      const type = mr.mimeType || mime || 'video/webm';

      const left = bgmEl.duration - bgmEl.currentTime;

    };

    setTimeout(() => { if (!recFading && recOn()) fadeOutStop(mcGain, ac, BGM_FADEOUT); }, Math.max(0, lim - BGM_FADEOUT) * 1000);
    setTimeout(() => { if (recOn()) mr.stop(); }, lim * 1000 + 300);

        offs += '<div class="k3m-offer"><span class="oc">' + esc(A(a.c)) + '</span><div class="oh" style="text-align:center">' + esc(A(a.title)) + '</div>' +
          '<img src="' + esc(a.qr) + '" alt="' + esc(a.cap) + '" style="display:block;width:100%;max-width:300px;margin:8px auto;border-radius:10px"><div class="od" style="text-align:center">' + esc(a.cap) + '</div></div>';
      } else {
        var holder = lang() === 'sc' && HOLDER_SC[a.holder] ? HOLDER_SC[a.holder] : a.holder;
        var bank = lang() === 'sc' && HOLDER_SC[a.bank] ? HOLDER_SC[a.bank] : a.bank;
        offs += '<div class="k3m-offer"><span class="oc">' + esc(A(a.c)) + '</span><div class="oh">' + esc(holder) + '</div><div class="od">' + esc(bank) + '</div><div class="oa">' + esc(a.acct) + '</div>' +
          '<button type="button" class="k3m-btn sm" onclick="K321MEET.copy(' + j + ')">📋 ' + esc(L('複製帳號', '复制账号', 'Copy account number')) + '</button></div>';
      }
    }
    return '<div class="k3m-head"><b>' + esc(L('聚會與奉獻', '聚会与奉献', 'Meetings & Giving')) + '</b><button type="button" class="k3m-x" onclick="K321MEET.close()" aria-label="close">✕</button></div>' +
      '<div class="k3m-body">' +
      '<p class="k3m-eb">' + esc(L('國度321空中團契', '国度321空中团契', 'Kingdom 321 Online Fellowship')) + '</p><h2 class="k3m-big">' + esc(L('同一個 Zoom，天天都在。', '同一个 Zoom，天天都在。', 'One Zoom, every day.')) + '</h2>' +
      '<div class="k3m-slot">' + nextCard() + '</div>' +
      '<div class="k3m-box"><p class="k3m-eb">🎥 ' + esc(L('線上聚會 Zoom', '线上聚会 Zoom', 'Online meeting · Zoom')) + '</p>' +
      '<a class="k3m-btn pri" href="' + esc(MEET_URL) + '" target="_blank" rel="noopener">' + esc(L('一鍵加入聚會', '一键加入聚会', 'Join the meeting')) + '</a>' +
      '<p class="k3m-muted">' + esc(L('會議 ID', '会议 ID', 'Meeting ID')) + ' <b>' + MEET_ID + '</b>　' + esc(L('密碼', '密码', 'Passcode')) + ' <b>' + MEET_PASS + '</b></p></div>' +
      '<div class="k3m-box"><p class="k3m-eb">' + esc(L('聚會時間表', '聚会时间表', 'Meeting schedule')) + '</p>' + rows + '</div>' +
      '<div class="k3m-box"><p class="k3m-eb">▶️ YouTube</p><a class="k3m-btn" href="' + esc(YT_URL) + '" target="_blank" rel="noopener">' + esc(L('前往 YouTube 頻道', '前往 YouTube 频道', 'Go to the YouTube channel')) + '</a></div>' +
      '<div class="k3m-box"><p class="k3m-eb">🎁 ' + esc(L('奉獻支持', '奉献支持', 'Giving')) + '</p>' +
      '<p class="k3m-muted" style="margin:0">' + esc(L('奉獻是回應神的供應，出於甘心樂意（林後九7）。凡事謝恩，把榮耀歸給神。', '奉献是回应神的供应，出于甘心乐意（林后九7）。凡事谢恩，把荣耀归给神。', 'Giving is our response to God’s provision, offered cheerfully (2 Corinthians 9:7). Give thanks in everything, and give the glory to God.')) + '</p>' +
      offs + '</div></div>';
  }

  var CSS = '' +
    '.k3m-wrap{background:var(--card,#fff);color:var(--ink,#1d2421);border:1px solid var(--line,#ddd8cc);border-radius:18px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.04);text-align:left;font-size:inherit;line-height:1.6}' +
    '.k3m-eb{margin:0 0 8px;font-size:.78em;font-weight:700;letter-spacing:.18em;color:var(--dusk,#6b7770)}' +
    '.k3m-intro{margin:0 0 8px;line-height:1.8;font-size:.95em}' +
    '.k3m-next{background:linear-gradient(160deg,#1F4D3D,#0E2a20);color:#fff;border-radius:16px;padding:16px 18px;margin:10px 0 12px;text-align:left}' +
    '.k3m-next .k3m-k{display:inline-block;background:rgba(255,255,255,.16);color:#E8C66A;border-radius:99px;padding:2px 12px;font-size:.8em;font-weight:700}' +
    '.k3m-next h4{margin:8px 0 2px;font-size:1.3em;color:#fff;font-weight:700}' +
    '.k3m-next .k3m-t{opacity:.95;font-size:.95em}.k3m-next .k3m-sub{font-size:.85em;opacity:.8}' +
    '.k3m-next .k3m-cd{color:#E8C66A;font-weight:700;margin:6px 0 10px;font-size:.95em}' +
    '.k3m-join,.k3m-btn{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:11px 14px;font:inherit;font-size:.95em;font-weight:600;cursor:pointer;box-sizing:border-box;width:100%}' +
    '.k3m-join{background:#9C6B18;border:1px solid #9C6B18;color:#fff!important}' +
    '.k3m-btn{background:var(--card,#fff);border:1px solid var(--line,#ddd8cc);color:var(--ink,#1d2421)!important;margin-top:8px}' +
    '.k3m-btn.pri{background:#1F4D3D;border-color:#1F4D3D;color:#fff!important}' +
    '.k3m-btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:.85em;margin-top:6px}' +
    '.k3m-more{display:block;width:100%;box-sizing:border-box;background:var(--card,#fff);color:var(--ink,#1d2421);border:1px solid var(--line,#ddd8cc);border-radius:12px;padding:11px 14px;font:inherit;font-size:.95em;cursor:pointer}' +
    '#k3mSheet{position:fixed;inset:0;z-index:2147483000;display:none}#k3mSheet.on{display:block}' +
    '#k3mSheet .k3m-mask{position:absolute;inset:0;background:rgba(0,0,0,.45)}' +
    '#k3mSheet .k3m-panel{position:absolute;left:0;right:0;bottom:0;top:max(24px,env(safe-area-inset-top));max-width:640px;margin:0 auto;background:var(--paper,#f3f1ec);color:var(--ink,#1d2421);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;font-size:17px;line-height:1.6;text-align:left}' +
    '#k3mSheet .k3m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line,#ddd8cc);background:var(--card,#fff)}' +
    '#k3mSheet .k3m-head b{font-size:1.05em}' +
    '#k3mSheet .k3m-x{border:0;background:transparent;font-size:22px;line-height:1;color:inherit;cursor:pointer;padding:4px 8px}' +
    '#k3mSheet .k3m-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}' +
    '#k3mSheet .k3m-big{margin:0 0 6px;font-size:1.35em;line-height:1.4}' +
    '.k3m-box{background:var(--card,#fff);border:1px solid var(--line,#ddd8cc);border-radius:16px;padding:14px 16px;margin:12px 0}' +
    '.k3m-muted{color:var(--dusk,#6b7770);font-size:.9em;margin:10px 0 0}' +
    '.k3m-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line,#ddd8cc)}.k3m-row:last-child{border-bottom:none}' +
    '.k3m-row .k3m-btn.sm{margin-top:0}' +
    '.k3m-time{flex:0 0 auto;min-width:96px;background:var(--paper,#f3f1ec);border-radius:12px;padding:6px 10px;text-align:center;font-size:.88em;line-height:1.5}.k3m-time b,.k3m-time small{display:block}.k3m-time small{color:var(--dusk,#6b7770);font-size:.82em}' +
    '.k3m-mid{flex:1;min-width:0}.k3m-mid .t{font-weight:700}.k3m-mid .s{font-size:.82em;color:var(--dusk,#6b7770)}.k3m-mid .cd{font-size:.82em;color:#1F4D3D;font-weight:700}' +
    '.k3m-offer{border:1px solid var(--line,#ddd8cc);border-radius:12px;padding:12px 14px;margin-top:10px}' +
    '.k3m-offer .oc{display:inline-block;background:#1F4D3D;color:#fff;border-radius:8px;padding:2px 10px;font-size:.8em;font-weight:700}' +
    '.k3m-offer .oh{font-weight:700;margin:8px 0 2px;overflow-wrap:anywhere}.k3m-offer .od{color:var(--dusk,#6b7770);font-size:.9em}' +
    '.k3m-offer .oa{font-family:ui-monospace,Menlo,monospace;font-size:1.02em;margin:6px 0 4px;overflow-wrap:anywhere}' +
    '#k3mToast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,28,24,.92);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:2147483001;pointer-events:none}';
  function css() {
    if (document.getElementById('k3mcss')) return;
    var s = document.createElement('style'); s.id = 'k3mcss'; s.textContent = CSS;
    (document.head || document.documentElement).appendChild(s);
  }
  function toast(t) {
    var el = document.getElementById('k3mToast');
    if (!el) { el = document.createElement('div'); el.id = 'k3mToast'; document.body.appendChild(el); }
    el.textContent = t; el.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function () { el.style.display = 'none'; }, 1800);
  }
  function copy(i) {
    var a = OFFERING[i].acct, ok = L('已複製帳號', '已复制账号', 'Account number copied');
    function fb() {
      var ta = document.createElement('textarea'); ta.value = a; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(ok); } catch (e) { toast(a); }
      document.body.removeChild(ta);
    }
    try { navigator.clipboard.writeText(a).then(function () { toast(ok); }, fb); } catch (e) { fb(); }
  }
  function open() {
    css();
    var el = document.getElementById('k3mSheet');
    if (!el) { el = document.createElement('div'); el.id = 'k3mSheet'; document.body.appendChild(el); }
    el.innerHTML = '<div class="k3m-mask" onclick="K321MEET.close()"></div><div class="k3m-panel">' + sheet() + '</div>';
    el.className = 'on';
    try { document.documentElement.style.overflow = 'hidden'; } catch (e) {}
  }
  function close() {
    var el = document.getElementById('k3mSheet'); if (el) el.className = '';
    try { document.documentElement.style.overflow = ''; } catch (e) {}
  }
  function tick() {
    var slots = document.querySelectorAll('.k3m-slot');
    if (!slots.length) return;
    var h = nextCard();
    for (var i = 0; i < slots.length; i++) slots[i].innerHTML = h;
  }

  /* ── 掛到首頁 ── */
  function place() {
    var hook = CFG.hook;
    if (!hook || !hook.sel) return;
    var host = document.querySelector(hook.sel);
    if (!host) return;
    if (host.querySelector('[data-k3m]')) return;
    if (hook.need && !hook.need(host)) return;
    var tmp = document.createElement('div'); tmp.innerHTML = card();
    var node = tmp.firstChild;
    var ref = hook.before ? host.querySelector(hook.before) : null;
    if (ref && ref.parentNode) ref.parentNode.insertBefore(node, ref);
    else if (hook.where === 'start') host.insertBefore(node, host.firstChild);
    else if (hook.after && host.querySelector(hook.after)) { var a = host.querySelector(hook.after); a.parentNode.insertBefore(node, a.nextSibling); }
    else host.appendChild(node);
  }
  var pend = 0;
  function watch() {
    if (!CFG.hook || !CFG.hook.sel) return;
    place();
    try {
      new MutationObserver(function () {
        if (pend) return;
        pend = setTimeout(function () { pend = 0; place(); }, 60);
      }).observe(document.body, { childList: true, subtree: true });
    } catch (e) {}
  }
  function wrapFn(name, marker) {
    var orig = window[name];
    if (typeof orig !== 'function' || orig.__k3m) return false;
    var w = function () {
      var h = orig.apply(this, arguments);
      if (typeof h !== 'string' || h.indexOf('data-k3m') >= 0) return h;
      var cut = marker ? h.lastIndexOf(marker) : -1;
      return cut > 0 ? h.slice(0, cut) + card() + h.slice(cut) : h + card();
    };
    w.__k3m = 1;
    window[name] = w;
    return true;
  }

  window.K321MEET = { open: open, close: close, copy: copy, card: card, nextCard: nextCard, place: place, tick: tick };
  css();
  function boot() {
    css();
    if (CFG.wrap) {
      if (wrapFn(CFG.wrap, CFG.marker || '') && CFG.rerender) { try { CFG.rerender(); } catch (e) {} }
    }
    watch();
    setInterval(tick, 30000);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
