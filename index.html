<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1628">
<title>萬象見神</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E8EAF1; --ink:#1A2233; --muted:#586177; --line:#D5D9E3;
  --accent:#2C5A9C; --accent-soft:rgba(44,90,156,.10); --red:#B94A30; --red-soft:rgba(185,74,48,.10);
  --good:#2E7D4F; --good-soft:rgba(46,125,79,.12); --warn:#9A6B00; --warn-soft:rgba(154,107,0,.13); --crit:#B4561C; --crit-soft:rgba(180,86,28,.13);
  --night1:#0F1628; --night2:#1C2A4A; --star:#F4E9C8;
  --fs:17px;
  --serif:"Noto Serif TC","PMingLiU","Songti TC",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1220; --surface:#151C2D; --sunk:#1C2438; --ink:#E6E9F1; --muted:#A1A9BC; --line:#2B3550;
    --accent:#8DB1EE; --accent-soft:rgba(141,177,238,.14); --red:#EE8A6C; --red-soft:rgba(238,138,108,.14);
    --good:#74C795; --good-soft:rgba(116,199,149,.14); --warn:#E1B652; --warn-soft:rgba(225,182,82,.14); --crit:#EE9A62; --crit-soft:rgba(238,154,98,.15);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1220; --surface:#151C2D; --sunk:#1C2438; --ink:#E6E9F1; --muted:#A1A9BC; --line:#2B3550;
  --accent:#8DB1EE; --accent-soft:rgba(141,177,238,.14); --red:#EE8A6C; --red-soft:rgba(238,138,108,.14);
  --good:#74C795; --good-soft:rgba(116,199,149,.14); --warn:#E1B652; --warn-soft:rgba(225,182,82,.14); --crit:#EE9A62; --crit-soft:rgba(238,154,98,.15);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.75;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;line-height:1.35;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.1em;letter-spacing:.08em}
.brand small{font-family:var(--sans);font-weight:400;font-size:.62em;color:var(--muted);letter-spacing:.04em;margin-left:8px}
.top .sp{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.8em;color:var(--muted)}
.proto{font-size:.72em;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 8px;letter-spacing:.04em}

/* hero */
.hero{margin-block:20px 8px;padding:28px 22px 22px;border-radius:14px;color:#EEF1F8;background:radial-gradient(120% 90% at 85% 0%,var(--night2) 0%,var(--night1) 70%);position:relative;overflow:hidden}
.hero h1{font-size:2.1em;letter-spacing:.12em;color:#fff}
.hero .v{font-family:var(--serif);font-size:1em;line-height:1.9;margin:14px 0 4px;color:#E3E7F2;max-width:32em}
.hero cite{font-style:normal;font-size:.8em;color:#AAB4CC}
.spec{margin-top:18px;height:14px;border-radius:3px;position:relative;background:linear-gradient(90deg,#5b2ca0,#2f5fe0 16%,#22b3d8 30%,#3fcf6a 45%,#e8e04a 60%,#f39a2d 75%,#d63a2a 92%)}
.spec i{position:absolute;top:0;bottom:0;width:2px;background:rgba(10,12,20,.85)}
.speclbl{display:flex;justify-content:space-between;font-size:.7em;color:#AAB4CC;margin-top:6px;letter-spacing:.06em}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.8}

.sec{margin-top:30px}
.sec h2{font-size:1.2em;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.sec h2 span{font-family:var(--sans);font-weight:400;font-size:.68em;color:var(--muted)}
.halls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.halls{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hall{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:112px}
.hall b{font-family:var(--serif);font-size:1.05em}
.hall .d{font-size:.78em;color:var(--muted);line-height:1.5}
.hall .st{margin-top:auto;font-size:.72em;letter-spacing:.04em;color:var(--muted)}
.hall.open{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hall.open .st{color:var(--accent);font-weight:700}
.hall[disabled]{opacity:.62;cursor:default}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:10px}
.q .m{font-family:var(--serif);font-size:1.3em;color:var(--red);line-height:1}
.q .t{flex:1}
.q .s{font-size:.72em;color:var(--muted)}

/* unit */
.uhead{margin-top:18px}
.eyebrow{font-size:.74em;letter-spacing:.14em;color:var(--muted)}
.uhead h1{font-size:1.9em;margin-top:4px}
.uhead .sub{color:var(--muted);margin-top:4px;font-size:.92em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:.72em;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.depth{display:flex;margin-top:16px;background:var(--sunk);border-radius:10px;padding:3px}
.depth button{flex:1;background:none;border:0;border-radius:8px;padding:6px 4px;font-size:.84em;color:var(--muted)}
.depth button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.depth button small{display:block;font-size:.76em;font-weight:400;color:var(--muted)}
.steps{display:flex;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.steps button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;font-size:.84em;color:var(--muted);white-space:nowrap}
.steps button .n{font-family:var(--mono);font-size:.8em;margin-right:4px}
.steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--red);font-weight:700}
.steps button.done{color:var(--accent)}
.body{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.body p{margin:0;max-width:36em}
.body h3{font-size:1.1em;margin-top:6px}
.body ul{margin:0;padding-left:1.3em}
.body li{margin:4px 0}
.dtag{font-size:.66em;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:2px}
.verse{margin:0;padding:14px 18px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0}
.verse p{font-family:var(--serif);line-height:1.95}
.verse cite{display:block;font-style:normal;font-size:.8em;color:var(--muted);margin-top:4px}
.analogy{padding:14px 16px;background:var(--sunk);border-radius:10px}
.lbl{display:inline-block;font-size:.7em;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.claim{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.chip{align-self:flex-start;font-size:.72em;font-weight:700;border-radius:4px;padding:1px 8px;letter-spacing:.04em}
.chip.c1{color:var(--good);background:var(--good-soft)}
.chip.c2{color:var(--warn);background:var(--warn-soft)}
.chip.c3{color:var(--crit);background:var(--crit-soft)}
.chip.c4{color:var(--accent);background:var(--accent-soft)}
details.refs{font-size:.8em;color:var(--muted)}
details.refs summary{cursor:pointer;color:var(--accent);width:max-content}
details.refs ol{margin:6px 0 0;padding-left:1.4em;line-height:1.6}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.views{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.views{grid-template-columns:1fr 1fr}}
.view{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.view b{font-family:var(--serif)}
.view p{font-size:.9em}
.sim{background:var(--night1);border-radius:12px;padding:12px;color:#E3E7F2}
.sim canvas{width:100%;aspect-ratio:16/10;display:block;border-radius:8px;max-width:100%}
.simctl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.simctl input{flex:1;min-width:160px;accent-color:#EE8A6C}
.simctl .num{font-size:.85em;color:#F4E9C8;min-width:9.5em}
.simbtn{background:#EE8A6C;color:#1A1208;border:0;border-radius:999px;padding:5px 14px;font-size:.85em;font-weight:700}
.simnote{font-size:.74em;color:#AAB4CC;margin-top:6px}
.pray{padding:16px;border:1px dashed var(--line);border-radius:10px}
.pray p{font-family:var(--serif)}
.quiz{display:flex;flex-direction:column;gap:14px}
.qz{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.qz .qq{font-weight:700;margin-bottom:8px}
.qz button{display:block;width:100%;text-align:left;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:.92em}
.qz button.ok{border-color:var(--good);background:var(--good-soft)}
.qz button.no{border-color:var(--crit);background:var(--crit-soft)}
.qz .fb{font-size:.85em;color:var(--muted);margin-top:8px}
.sharebox img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.sharebox p{font-size:.82em;color:var(--muted);margin-top:6px}
.nav{display:flex;gap:10px;margin-top:26px}
.nav button{flex:1;border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.nav button.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.nav button[disabled]{opacity:.4;cursor:default}
.readbtn{display:inline-flex;align-items:center;gap:6px}

/* today & me */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:16px}
.card .date{font-family:var(--mono);font-size:.78em;color:var(--muted)}
.attrs{display:flex;flex-direction:column;gap:10px}
.attr{display:grid;grid-template-columns:4.2em 1fr 2.4em;align-items:center;gap:10px;font-size:.92em}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.attr .num{text-align:right;color:var(--muted);font-size:.85em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;font-size:.85em}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.muted{color:var(--muted);font-size:.85em}
.foot{margin-top:36px;font-size:.74em;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:720px;margin:0 auto;display:flex}
.tabbar button{flex:1;background:none;border:0;padding:10px 4px 12px;font-size:.8em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in"><span class="brand">萬象見神<small>Creation Speaks</small></span><span class="sp"></span><span class="proto">原型</span><button class="iconbtn" id="themeBtn" aria-label="切換深淺色">深／淺</button></div></header>
<main class="wrap" id="main"></main>
<nav class="tabbar" aria-label="主選單"><div class="in">
<button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-20 12 12)"/></svg>展館</button>
<button data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>今日</button>
<button data-go="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.8 4-5.6 7.5-5.6s6.3 1.8 7.5 5.6"/></svg>我的</button>
</div></nav>
<script>

};

var CERT = { 1: '已確立', 2: '主流，仍有討論', 3: '研究中或有爭議', 4: '哲學推論' };

var HALLS = [
  { k: 'cosmos', n: '宇宙館', d: '宇宙的開端與微調', open: true },
  { k: 'earth', n: '地球館', d: '罕見的適居地球' },
  { k: 'life', n: '生命館', d: 'DNA 與細胞機器' },
  { k: 'body', n: '人體館', d: '眼、腦、胚胎的奇妙' },
  { k: 'mind', n: '心智館', d: '意識、理性與良心' },

];

var QUESTIONS = [

  { q: '宇宙為什麼剛好適合生命？', s: '宇宙館・即將開放' },
  { q: '科學和信仰一定互相衝突嗎？', s: '科學史館・即將開放' }
];

var ATTRS = ['永能', '永恆', '智慧', '信實', '良善', '美善', '公義'];

var UNIT = {
  id: 'cosmos-beginning',
  hall: '宇宙館',
  no: '第 1 單元',
  title: '宇宙有開端',
  sub: '二十世紀天文學最震撼的發現，印證了聖經的第一句話。',
  attrs: ['永能', '永恆'],
  steps: [
    { k: '驚嘆', blocks: [
      { d: 1, t: 'p', h: '如果把宇宙的歷史拍成一部影片，然後按下「倒帶」，你會看見什麼？' },
      { d: 1, t: 'p', h: '所有的星系都在往回跑，彼此越靠越近，最後擠進一個又熱又密的起點。在那一刻之前，我們的望遠鏡什麼也看不見。' },
      { d: 1, t: 'sim' },
      { d: 1, t: 'verse', h: '起初，神創造天地。', ref: '創世記 1:1' },
      { d: 2, t: 'p', h: '三千多年前，摩西寫下聖經的第一句話；二十世紀的天文學家，花了幾十年、用盡最好的儀器，才走到同一個結論：宇宙不是一直都在，宇宙有開端。' }
    ]},
    { k: '發現', blocks: [
      { d: 1, t: 'h', h: '星系都在彼此遠離' },
      { d: 1, t: 'p', h: '天文學家發現，遙遠星系的光都往紅色那一端偏移，稱為「紅移」。紅移表示星系正在遠離我們，而且越遠的星系，遠離得越快。' },
      { d: 1, t: 'analogy', h: '想像一個還在發酵的葡萄乾麵包。麵團脹大時，每一顆葡萄乾都會看見其他葡萄乾離自己而去，離得越遠的，退得越快。宇宙就像這個麵團，不是星系在空間裡飛散，而是空間本身在膨脹。' },
      { d: 2, t: 'p', h: '1912 年起，美國天文學家斯里弗（Vesto Slipher）量到多數螺旋星雲的光譜都有紅移。1927 年，比利時的物理學家勒梅特（Georges Lemaître）從愛因斯坦的方程式推出宇宙正在膨脹；他同時也是一位天主教神父。1929 年，哈伯（Edwin Hubble）用觀測數據證實：星系的距離與遠離速度成正比。2018 年，國際天文學聯合會建議將這個定律改稱為「哈伯－勒梅特定律」。', refs: ['slipher', 'lemaitre', 'hubble'] },

        h += '<button data-q="' + i + '" data-o="' + j + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + q.o[j] + '</button>';
      }
      if (ans !== undefined) { h += '<p class="fb">' + (ans === q.a ? '答對了。' : '再想一想。') + q.e + '</p>'; }
      h += '</div>';
    }
    return h + '</div>';
  }

  function todayView() {
    var d = new Date();
    var ds = d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate();
    return '<div class="uhead"><div class="eyebrow">每日造物靈修</div><h1>今天抬頭看天</h1></div>' +
      '<div class="card"><span class="date">' + ds + '</span>' +
      '<blockquote class="verse"><p>' + TODAY.verse + '</p><cite>' + TODAY.ref + '（和合本）</cite></blockquote>' +
      '<p>' + TODAY.h + '</p><div class="pray"><p>' + TODAY.pray + '</p></div>' +
      '<div class="row"><button class="iconbtn" id="readToday">朗讀</button><button class="iconbtn" data-open="unit">延伸閱讀：宇宙有開端 ›</button></div></div>' + foot();
  }

  function meView() {
    var total = 0, i;
    for (i = 0; i < ATTRS.length; i++) { total += S.attrs[ATTRS[i]] || 0; }
    var h = '<div class="uhead"><div class="eyebrow">我的</div><h1>我所認識的神</h1><p class="sub">每完成一個單元，就更認識神的一個面向。</p></div><div class="card"><div class="attrs">';
    for (i = 0; i < ATTRS.length; i++) {
      var n = S.attrs[ATTRS[i]] || 0;
      h += '<div class="attr"><span>' + ATTRS[i] + '</span><span class="bar"><i style="width:' + Math.min(100, n * 25) + '%"></i></span><span class="num">' + n + '</span></div>';
    }
    h += '</div>' + (total ? '' : '<p class="muted">完成「宇宙有開端」後，這裡會亮起「永能」與「永恆」。</p>') + '</div>';
    h += '<div class="card"><b>閱讀設定</b>' +
      '<div class="row"><span class="muted" style="width:4em">字級</span><div class="seg">' +
      seg('fs', 15, '小') + seg('fs', 17, '中') + seg('fs', 20, '大') + '</div></div>' +
      '<div class="row"><span class="muted" style="width:4em">朗讀</span><div class="seg">' +
      seg('rate', 0.8, '慢') + seg('rate', 1, '正常') + seg('rate', 1.2, '快') + '</div></div>' +
      '<div class="row"><button class="iconbtn" id="resetBtn">清除學習紀錄</button><span class="muted" id="resetMsg"></span></div></div>';
    return h + foot();
  }
  function seg(k, v, t) { return '<button data-set="' + k + '" data-val="' + v + '" aria-pressed="' + (S[k] === v) + '">' + t + '</button>'; }

  /* ---------- after render ---------- */
  function after() {
    if ($('stars')) { drawStars($('stars')); }
    if ($('simCv')) { initSim(); }
    if ($('shareImg')) { makeShare($('shareImg')); }
    if (S.view === 'unit') { S.seen[S.step] = true; }
  }

  function rng(seed) {
    var x = seed;
    return function () { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; };
  }

  function drawStars(cv) {
    var r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width)); cv.height = Math.max(1, Math.round(r.height));
    var c = cv.getContext('2d'), R = rng(7);
    for (var i = 0; i < 120; i++) {
      c.globalAlpha = 0.25 + R() * 0.6;
      c.fillStyle = '#F4E9C8';
      var s = R() < 0.9 ? 1 : 2;
      c.fillRect(R() * cv.width, R() * cv.height, s, s);
    }
  }

  /* ---------- rewind simulation ---------- */
  var GAL = null, playTimer = null;
  function initSim() {
    if (!GAL) {
      GAL = [];
      var R = rng(11);
      for (var i = 0; i < 180; i++) {
        var a = R() * Math.PI * 2, d = Math.sqrt(R());
        GAL.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 0.62, s: 0.6 + R() * 1.8, h: R() });
      }
    }
    var inp = $('simT');
    inp.oninput = function () { drawSim(inp.value / 1000); };
    $('simPlay').onclick = function () {
      if (playTimer) { return; }
      var v = inp.value > 20 ? +inp.value : 1000;
      playTimer = window.setInterval(function () {
        v -= 12;
        if (v <= 0) { v = 0; window.clearInterval(playTimer); playTimer = null; }
        inp.value = v; drawSim(v / 1000);
      }, 30);
    };
    drawSim(inp.value / 1000);
  }
  function drawSim(t) {
    var cv = $('simCv'); if (!cv) { return; }
    var c = cv.getContext('2d'), W = cv.width, H = cv.height, cx = W / 2, cy = H / 2;
    c.fillStyle = '#0F1628'; c.fillRect(0, 0, W, H);
    var sc = Math.max(t, 0.004), R = W * 0.47 * sc;
    var glow = t < 0.2 ? (0.2 - t) / 0.2 : 0;
    if (glow > 0) {
      var g = c.createRadialGradient(cx, cy, 0, cx, cy, W * 0.5);
      g.addColorStop(0, 'rgba(255,214,150,' + (0.95 * glow) + ')');
      g.addColorStop(0.35, 'rgba(238,138,108,' + (0.55 * glow) + ')');
      g.addColorStop(1, 'rgba(15,22,40,0)');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
    for (var i = 0; i < GAL.length; i++) {
      var p = GAL[i];
      var red = Math.round(170 + 85 * p.h * t), gr = Math.round(190 + 40 * (1 - p.h)), bl = Math.round(255 - 110 * p.h * t);
      c.fillStyle = 'rgb(' + red + ',' + gr + ',' + bl + ')';
      c.globalAlpha = 0.85;
      c.beginPath(); c.arc(cx + p.x * R, cy + p.y * R, p.s * (0.7 + 0.6 * t), 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
    var lbl = $('simLbl');
    if (lbl) {
      if (t >= 0.999) { lbl.textContent = '現在'; }
      else if (t <= 0.001) { lbl.textContent = '約 138 億年前・開端'; }
      else { lbl.textContent = '往回約 ' + Math.round(138 * (1 - t)) + ' 億年（示意）'; }
    }
  }

  /* ---------- share card ---------- */
  function wrapText(c, text, maxW) {
    var lines = [], cur = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (c.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; } else { cur += ch; }
    }
    if (cur) { lines.push(cur); }
    return lines;
  }
  function makeShare(img) {
    var cv = document.createElement('canvas'); cv.width = 1600; cv.height = 900;
    var c = cv.getContext('2d');
    var g = c.createRadialGradient(1300, 80, 50, 1000, 400, 1300);
    g.addColorStop(0, '#2A3E6B'); g.addColorStop(0.6, '#121A30'); g.addColorStop(1, '#0B1020');
    c.fillStyle = g; c.fillRect(0, 0, 1600, 900);
    var R = rng(23);
    for (var i = 0; i < 260; i++) {
      c.globalAlpha = 0.2 + R() * 0.7; c.fillStyle = '#F4E9C8';
      var s = R() < 0.92 ? 2 : 4; c.fillRect(R() * 1600, R() * 900, s, s);
    }
    c.globalAlpha = 1;
    var serif = '"Noto Serif TC","PMingLiU","Songti TC",serif', sans = '"Noto Sans TC","Microsoft JhengHei",sans-serif';
    c.fillStyle = '#EE8A6C'; c.font = '500 34px ' + sans; c.fillText('萬象見神・宇宙館', 120, 150);
    c.fillStyle = '#FFFFFF'; c.font = '700 110px ' + serif; c.fillText('宇宙有開端', 120, 300);
    c.fillStyle = '#E3E7F2'; c.font = '600 46px ' + serif;
    var lines = wrapText(c, '「我們因著信，就知道諸世界是藉神話造成的；這樣，所看見的，並不是從顯然之物造出來的。」', 1300);
    for (var j = 0; j < lines.length; j++) { c.fillText(lines[j], 120, 420 + j * 74); }
    c.fillStyle = '#AAB4CC'; c.font = '400 34px ' + sans; c.fillText('希伯來書 11:3（和合本）', 120, 440 + lines.length * 74);
    var sy = 800, cols = ['#5b2ca0', '#2f5fe0', '#22b3d8', '#3fcf6a', '#e8e04a', '#f39a2d', '#d63a2a'];
    var sg = c.createLinearGradient(120, 0, 1480, 0);
    for (var k = 0; k < cols.length; k++) { sg.addColorStop(k / (cols.length - 1), cols[k]); }
    c.fillStyle = sg; c.fillRect(120, sy, 1360, 22);
    c.fillStyle = 'rgba(10,12,20,.85)';
    var ls = [0.24, 0.41, 0.63, 0.85];
    for (var m = 0; m < ls.length; m++) { c.fillRect(120 + 1360 * ls[m], sy, 4, 22); }
    try { img.src = cv.toDataURL('image/png'); } catch (e) {}
  }

  /* ---------- speech ---------- */
  var speaking = false;
  function stopSpeak() {
    speaking = false;
    try { if (window.speechSynthesis) { window.speechSynthesis.cancel(); } } catch (e) {}
    var b = $('readBtn'); if (b) { b.textContent = '朗讀這一步'; }
  }
  function speak(el, btn, label) {
    if (!window.speechSynthesis) { btn.textContent = '此裝置不支援朗讀'; return; }
    if (speaking) { stopSpeak(); btn.textContent = label; return; }
    var clone = el.cloneNode(true);
    var drop = clone.querySelectorAll('details,.sim,.sharebox,.quiz,.chip,.dtag');
    for (var i = 0; i < drop.length; i++) { drop[i].parentNode.removeChild(drop[i]); }
    var text = (clone.textContent || '').replace(/\s+/g, ' ');
    var parts = text.split(/(?=[。！？])/);
    var chunks = [], cur = '';
    for (var j = 0; j < parts.length; j++) {
      if ((cur + parts[j]).length > 120 && cur) { chunks.push(cur); cur = parts[j]; } else { cur += parts[j]; }
    }
    if (cur) { chunks.push(cur); }
    speaking = true; btn.textContent = '停止朗讀';
    var idx = 0;
    function next() {
      if (!speaking || idx >= chunks.length) { speaking = false; btn.textContent = label; return; }
      var u = new window.SpeechSynthesisUtterance(chunks[idx++].replace(/^[。！？]/, ''));
      u.lang = 'zh-TW'; u.rate = S.rate;
      u.onend = next; u.onerror = function () { speaking = false; btn.textContent = label; };
      window.speechSynthesis.speak(u);
    }
    next();
  }

  /* ---------- events ---------- */
  function go(v) { S.view = v; if (v === 'unit' && S.step >= UNIT.steps.length) { S.step = 0; } render(); window.scrollTo(0, 0); }

  function finish() {
    if (!S.done[UNIT.id]) {
      S.done[UNIT.id] = true;
      for (var i = 0; i < UNIT.attrs.length; i++) { S.attrs[UNIT.attrs[i]] = (S.attrs[UNIT.attrs[i]] || 0) + 1; }
      S.step = 0; go('me');
    } else { S.step = 0; go('home'); }
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && (t.hasAttribute('data-go') || t.hasAttribute('data-open') || t.hasAttribute('data-step') || t.hasAttribute('data-depth') || t.hasAttribute('data-q') || t.hasAttribute('data-set') || t.id))) { t = t.parentNode; }
    if (!t || t === document) { return; }
    if (t.hasAttribute('data-go')) { go(t.getAttribute('data-go')); return; }
    if (t.hasAttribute('data-open')) { go(t.getAttribute('data-open')); return; }
    if (t.hasAttribute('data-step')) { S.step = +t.getAttribute('data-step'); render(); return; }
    if (t.hasAttribute('data-depth')) { S.depth = +t.getAttribute('data-depth'); render(); return; }
    if (t.hasAttribute('data-q')) {
      var qi = +t.getAttribute('data-q');
      if (S.quiz[qi] === undefined) { S.quiz[qi] = +t.getAttribute('data-o'); render(); }
      return;
    }
    if (t.hasAttribute('data-set')) { S[t.getAttribute('data-set')] = +t.getAttribute('data-val'); render(); return; }
    switch (t.id) {
      case 'prevBtn': if (S.step > 0) { S.step--; render(); window.scrollTo(0, 0); } break;
      case 'nextBtn':
        if (S.step < UNIT.steps.length - 1) { S.step++; render(); window.scrollTo(0, 0); } else { finish(); }
        break;
      case 'readBtn': speak($('stepBody'), t, '朗讀這一步'); break;
      case 'readToday': speak(t.parentNode.parentNode, t, '朗讀'); break;
      case 'themeBtn':
        var cur = document.documentElement.getAttribute('data-theme');
        var dark = cur ? cur === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
        render(); break;
      case 'resetBtn':
        if (t.getAttribute('data-arm') === '1') {
          S.done = {}; S.seen = {}; S.attrs = {}; S.quiz = {}; S.step = 0; render();
          $('resetMsg').textContent = '已清除。';
        } else { t.setAttribute('data-arm', '1'); t.textContent = '再按一次確認清除'; }
        break;
    }
  });

  load();
  if (S.view === 'unit' && !(S.step >= 0 && S.step < UNIT.steps.length)) { S.step = 0; }
  render();
})();

</script>
</body>
</html>
