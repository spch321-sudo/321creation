<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1628">
<link rel="manifest" href="manifest-en.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="321 Creation Speaks">
<title>321 Creation Speaks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E8EAF1; --ink:#1A2233; --muted:#586177; --line:#D5D9E3;
  --accent:#2C5A9C; --accent-soft:rgba(44,90,156,.10); --red:#B94A30; --red-soft:rgba(185,74,48,.10);
  --good:#2E7D4F; --good-soft:rgba(46,125,79,.12); --warn:#9A6B00; --warn-soft:rgba(154,107,0,.13); --crit:#B4561C; --crit-soft:rgba(180,86,28,.13);
  --hl-gold:#F5E6C4;--hl-green:#DDEFD9;--hl-blue:#DCE7F7;--hl-pink:#FADDE4;--hl-purple:#E8DEF4;--hl-maroon:#F0DADA;--hl-brown:#EEE1CD;--hl-charcoal:#E3E2DE;--reading:#D6E3F7;
  --night1:#0F1628; --night2:#1C2A4A; --star:#F4E9C8;
  --fs:17px;
  --serif:"Noto Serif TC","PMingLiU","Songti TC",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1220; --surface:#151C2D; --sunk:#1C2438; --ink:#E6E9F1; --muted:#A1A9BC; --line:#2B3550;
    --accent:#8DB1EE; --accent-soft:rgba(141,177,238,.14); --red:#EE8A6C; --red-soft:rgba(238,138,108,.14);
    --good:#74C795; --good-soft:rgba(116,199,149,.14); --warn:#E1B652; --warn-soft:rgba(225,182,82,.14); --crit:#EE9A62; --crit-soft:rgba(238,154,98,.15);
    --hl-gold:#3D3218;--hl-green:#1F3320;--hl-blue:#1E2C44;--hl-pink:#3E2330;--hl-purple:#2F2640;--hl-maroon:#3A2222;--hl-brown:#39301F;--hl-charcoal:#2E2E2B;--reading:#26395A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1220; --surface:#151C2D; --sunk:#1C2438; --ink:#E6E9F1; --muted:#A1A9BC; --line:#2B3550;
  --accent:#8DB1EE; --accent-soft:rgba(141,177,238,.14); --red:#EE8A6C; --red-soft:rgba(238,138,108,.14);
  --good:#74C795; --good-soft:rgba(116,199,149,.14); --warn:#E1B652; --warn-soft:rgba(225,182,82,.14); --crit:#EE9A62; --crit-soft:rgba(238,154,98,.15);
  --hl-gold:#3D3218;--hl-green:#1F3320;--hl-blue:#1E2C44;--hl-pink:#3E2330;--hl-purple:#2F2640;--hl-maroon:#3A2222;--hl-brown:#39301F;--hl-charcoal:#2E2E2B;--reading:#26395A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.75;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;line-height:1.35;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.1em;letter-spacing:.08em}
.brand small{font-family:var(--sans);font-weight:400;font-size:.62em;color:var(--muted);letter-spacing:.04em;margin-left:8px}
.top .sp{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.8em;color:var(--muted)}
.proto{font-size:.72em;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 8px;letter-spacing:.04em}

/* hero */
.hero{margin-block:20px 8px;padding:28px 22px 22px;border-radius:14px;color:#EEF1F8;background:radial-gradient(120% 90% at 85% 0%,var(--night2) 0%,var(--night1) 70%);position:relative;overflow:hidden}
.hero h1{font-size:2.1em;letter-spacing:.12em;color:#fff}
.hero .v{font-family:var(--serif);font-size:1em;line-height:1.9;margin:14px 0 4px;color:#E3E7F2;max-width:32em}
.hero cite{font-style:normal;font-size:.8em;color:#AAB4CC}
.spec{margin-top:18px;height:14px;border-radius:3px;position:relative;background:linear-gradient(90deg,#5b2ca0,#2f5fe0 16%,#22b3d8 30%,#3fcf6a 45%,#e8e04a 60%,#f39a2d 75%,#d63a2a 92%)}
.spec i{position:absolute;top:0;bottom:0;width:2px;background:rgba(10,12,20,.85)}
.speclbl{display:flex;justify-content:space-between;font-size:.7em;color:#AAB4CC;margin-top:6px;letter-spacing:.06em}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.8}

.sec{margin-top:30px}
.sec h2{font-size:1.2em;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.sec h2 span{font-family:var(--sans);font-weight:400;font-size:.68em;color:var(--muted)}
.halls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.halls{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hall{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:112px}
.hall b{font-family:var(--serif);font-size:1.05em}
.hall .d{font-size:.78em;color:var(--muted);line-height:1.5}
.hall .st{margin-top:auto;font-size:.72em;letter-spacing:.04em;color:var(--muted)}
.hall.open{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hall.open .st{color:var(--accent);font-weight:700}
.hall[disabled]{opacity:.62;cursor:default}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:10px}
.q .m{font-family:var(--serif);font-size:1.3em;color:var(--red);line-height:1}
.q .t{flex:1}
.q .s{font-size:.72em;color:var(--muted)}

/* unit */
.uhead{margin-top:18px}
.eyebrow{font-size:.74em;letter-spacing:.14em;color:var(--muted)}
.uhead h1{font-size:1.9em;margin-top:4px}
.uhead .sub{color:var(--muted);margin-top:4px;font-size:.92em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:.72em;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.depth{display:flex;margin-top:16px;background:var(--sunk);border-radius:10px;padding:3px}
.depth button{flex:1;background:none;border:0;border-radius:8px;padding:6px 4px;font-size:.84em;color:var(--muted)}
.depth button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.depth button small{display:block;font-size:.76em;font-weight:400;color:var(--muted)}
.steps{display:flex;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.steps button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px;font-size:.8em;color:var(--muted);white-space:nowrap}
.steps button .n{display:none}
@media (min-width:560px){.steps button{padding:8px 10px;font-size:.84em}.steps button .n{display:inline}}
.steps button .n{font-family:var(--mono);font-size:.8em;margin-right:4px}
.steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--red);font-weight:700}
.steps button.done{color:var(--accent)}
.body{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.body p{margin:0;max-width:36em}
.body h3{font-size:1.1em;margin-top:6px}
.body ul{margin:0;padding-left:1.3em}
.body li{margin:4px 0}
.dtag{font-size:.66em;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:2px}
.verse{margin:0;padding:14px 18px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0}
.verse p{font-family:var(--serif);line-height:1.95}
.verse cite{display:block;font-style:normal;font-size:.8em;color:var(--muted);margin-top:4px}
.analogy{padding:14px 16px;background:var(--sunk);border-radius:10px}
.lbl{display:inline-block;font-size:.7em;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.claim{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.chip{align-self:flex-start;font-size:.72em;font-weight:700;border-radius:4px;padding:1px 8px;letter-spacing:.04em}
.chip.c1{color:var(--good);background:var(--good-soft)}
.chip.c2{color:var(--warn);background:var(--warn-soft)}
.chip.c3{color:var(--crit);background:var(--crit-soft)}
.chip.c4{color:var(--accent);background:var(--accent-soft)}
details.refs{font-size:.8em;color:var(--muted)}
details.refs summary{cursor:pointer;color:var(--accent);width:max-content}
details.refs ol{margin:6px 0 0;padding-left:1.4em;line-height:1.6}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.views{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.views{grid-template-columns:1fr 1fr}}
.view{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.view b{font-family:var(--serif)}
.view p{font-size:.9em}
.sim{background:var(--night1);border-radius:12px;padding:12px;color:#E3E7F2}
.sim canvas{width:100%;aspect-ratio:16/10;display:block;border-radius:8px;max-width:100%}
.simctl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.simctl input{flex:1;min-width:160px;accent-color:#EE8A6C}
.simctl .num{font-size:.85em;color:#F4E9C8;min-width:9.5em}
.simbtn{background:#EE8A6C;color:#1A1208;border:0;border-radius:999px;padding:5px 14px;font-size:.85em;font-weight:700}
.simnote{font-size:.74em;color:#AAB4CC;margin-top:6px}
.pray{padding:16px;border:1px dashed var(--line);border-radius:10px}
.pray p{font-family:var(--serif)}
.quiz{display:flex;flex-direction:column;gap:14px}
.qz{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.qz .qq{font-weight:700;margin-bottom:8px}
.qz button{display:block;width:100%;text-align:left;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:.92em}
.qz button.ok{border-color:var(--good);background:var(--good-soft)}
.qz button.no{border-color:var(--crit);background:var(--crit-soft)}
.qz .fb{font-size:.85em;color:var(--muted);margin-top:8px}
.sharebox img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.sharebox p{font-size:.82em;color:var(--muted);margin-top:6px}
.nav{display:flex;gap:10px;margin-top:26px}
.nav button{flex:1;border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.nav button.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.nav button[disabled]{opacity:.4;cursor:default}
.readbtn{display:inline-flex;align-items:center;gap:6px}

.dialbar{position:relative;height:18px;border-radius:9px;background:rgba(238,154,98,.35)}
.dialbar .win{position:absolute;left:0;top:0;bottom:0;width:2.1%;min-width:5px;background:#74C795;border-radius:9px 0 0 9px}
.dialbar .mk{position:absolute;top:-5px;width:4px;height:28px;margin-left:-2px;background:#F4E9C8;border-radius:2px}
.dialst{margin:10px 0 0;font-weight:700}
.scale .scn{font-family:var(--serif);font-size:1.8em;color:#fff}
.scale .scv{color:#E3E7F2}
.scale .scl{color:#F4E9C8;font-size:.9em;margin-top:2px}
.dots{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:30px}
.dots i{display:block;border-radius:50%;background:rgba(244,233,200,.18)}
.dots i.on{background:#EE8A6C}
.zonebar{position:relative;height:18px;border-radius:9px;overflow:visible;display:flex}
.zonebar .zin{width:30%;background:rgba(238,154,98,.45);border-radius:9px 0 0 9px}
.zonebar .zok{width:28%;background:#74C795}
.zonebar .zout{flex:1;background:linear-gradient(90deg,#B9D98C 0,#B9D98C 47.6%,rgba(141,177,238,.4) 47.6%);border-radius:0 9px 9px 0}
.zonebar .mk{position:absolute;top:-5px;width:4px;height:28px;margin-left:-2px;background:#F4E9C8;border-radius:2px}
.zlab{display:flex;justify-content:space-between;font-size:.72em;color:#AAB4CC;margin-top:4px;font-family:var(--mono)}
.steps button.sertab{color:var(--red);font-weight:700}
.sermon h2.stitle{font-size:1.45em;margin-top:4px}
.sermon h3.sh{font-size:1.15em;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sermon h4.ss{font-family:var(--serif);font-size:1em;margin:4px 0 0;color:var(--accent)}
.langs{display:flex;gap:2px;font-size:.78em}
.langs a{color:var(--muted);text-decoration:none;padding:3px 7px;border-radius:6px}
.langs a[aria-current="true"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
@media (max-width:420px){.brand small{display:none}.proto{display:none}}
:lang(en) .attr{grid-template-columns:8.6em 1fr 2.4em}
:lang(en) .hero h1{letter-spacing:.04em}
/* ---- 畫線、朗讀、小智 ---- */
.blk{display:contents}
#stepBody .sent,#todayText .sent{cursor:pointer;border-radius:2px}
.sent[data-hl]{background:linear-gradient(transparent 55%,var(--hl-gold) 55%)}
.sent[data-color="green"]{background:linear-gradient(transparent 55%,var(--hl-green) 55%)}
.sent[data-color="blue"]{background:linear-gradient(transparent 55%,var(--hl-blue) 55%)}
.sent[data-color="pink"]{background:linear-gradient(transparent 55%,var(--hl-pink) 55%)}
.sent[data-color="purple"]{background:linear-gradient(transparent 55%,var(--hl-purple) 55%)}
.sent[data-color="maroon"]{background:linear-gradient(transparent 55%,var(--hl-maroon) 55%)}
.sent[data-color="brown"]{background:linear-gradient(transparent 55%,var(--hl-brown) 55%)}
.sent[data-color="charcoal"]{background:linear-gradient(transparent 55%,var(--hl-charcoal) 55%)}
.sent.tts-reading{box-shadow:inset 0 0 0 999px var(--reading);-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:box-shadow .2s}
.hl-note{margin:6px 0 0;padding:8px 12px;background:var(--sunk);border-left:3px solid #D9B168;border-radius:6px;font-size:.85em;white-space:pre-wrap;line-height:1.6}
.hl-note[data-color="green"]{border-left-color:#6FAE71}.hl-note[data-color="blue"]{border-left-color:#6C93D1}.hl-note[data-color="pink"]{border-left-color:#E58FA0}.hl-note[data-color="purple"]{border-left-color:#A48AC9}.hl-note[data-color="maroon"]{border-left-color:#8C4A4E}.hl-note[data-color="brown"]{border-left-color:#8A6740}.hl-note[data-color="charcoal"]{border-left-color:#54534E}
.hlsheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
.hlsheet-card{background:var(--surface);width:100%;max-width:720px;margin:0 auto;max-height:86vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.hlsheet-title{font-weight:700}
.hlsheet-quote{background:var(--hl-gold);border-radius:8px;padding:10px 12px;font-family:var(--serif);line-height:1.8}
.hlsheet-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hlsheet-label{font-size:.8em;color:var(--muted);min-width:2.5em}
.hlsheet-colors{display:flex;gap:10px;flex-wrap:wrap}
.hlswatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.hlswatch.active{border-color:var(--ink)}
.spanrow{display:flex;align-items:center;gap:8px}
.spanbtn{min-width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.spannum{font-size:.85em;color:var(--muted);min-width:3em;text-align:center}
.hl-hint{margin:0;font-size:.78em;color:var(--muted)}
.hlsheet-ta,.chatinput textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--sunk);color:var(--ink);resize:vertical}
.hlsheet-ta{min-height:84px}
.hlsheet-acts{display:flex;gap:8px}
.sbtn{flex:1;border-radius:10px;padding:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.sbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.sbtn.danger{color:var(--crit);border-color:var(--crit)}
.uitoast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.8em;padding:8px 16px;border-radius:999px;z-index:50;max-width:88vw;text-align:center}
.readbtn[data-state="playing"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.chatwrap{display:flex;flex-direction:column;gap:10px}
.chatctx{align-self:flex-start;font-size:.78em;color:var(--muted);background:var(--sunk);border-radius:999px;padding:4px 12px}
.qs-toggle{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:.82em;font-weight:700}
.qs-panel{border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:10px;display:flex;flex-direction:column;gap:6px}
.qs-chip{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.85em;line-height:1.5}
.chatlog{display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;line-height:1.8}
.msg.user{background:var(--accent);color:var(--bg);margin-left:auto;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai{background:var(--surface);border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:4px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin-bottom:0}
.msg.ai h4{margin:12px 0 4px;font-size:1em;color:var(--accent);font-family:var(--serif)}
.msg.ai blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0;font-family:var(--serif)}
.msg.ai ul{margin:4px 0 8px;padding-left:20px}.msg.ai li{margin-bottom:4px}
.msg.ai hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.msg.ai .mdtb{display:block;width:100%;overflow-x:auto;border-collapse:collapse;margin:10px 0;font-size:.88em}
.msg.ai .mdtb th,.msg.ai .mdtb td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.msg.ai .mdtb th{background:var(--sunk)}
.msg-actions{display:flex;gap:4px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.msg-act{border:none;background:transparent;color:var(--muted);font-size:.78em;padding:4px 8px;border-radius:999px}
.msg-act.on{color:var(--accent);font-weight:700}
.chatinput{display:flex;gap:8px;position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.chatinput textarea{resize:none;max-height:120px}
.chatinput button{border:none;background:var(--accent);color:var(--bg);border-radius:10px;padding:0 16px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.chatnote{margin:0;font-size:.74em}
.brandicon{width:30px;height:30px;border-radius:8px;flex:0 0 auto;margin-right:-4px}
.brand{white-space:nowrap}
:lang(en) .brand{letter-spacing:0;font-size:1em}
/* today & me */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:16px}
.card .date{font-family:var(--mono);font-size:.78em;color:var(--muted)}
.attrs{display:flex;flex-direction:column;gap:10px}
.attr{display:grid;grid-template-columns:4.2em 1fr 2.4em;align-items:center;gap:10px;font-size:.92em}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.attr .num{text-align:right;color:var(--muted);font-size:.85em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;font-size:.85em}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.muted{color:var(--muted);font-size:.85em}
.foot{margin-top:36px;font-size:.74em;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:720px;margin:0 auto;display:flex}
.tabbar button{flex:1;background:none;border:0;padding:10px 4px 12px;font-size:.8em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

  function rng(seed) {
    var x = seed;
    return function () { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; };
  }

  function drawStars(cv) {
    var r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width)); cv.height = Math.max(1, Math.round(r.height));
    var c = cv.getContext('2d'), R = rng(7);
    for (var i = 0; i < 120; i++) {
      c.globalAlpha = 0.25 + R() * 0.6;
      c.fillStyle = '#F4E9C8';
      var s = R() < 0.9 ? 1 : 2;
      c.fillRect(R() * cv.width, R() * cv.height, s, s);
    }
  }

  /* ---------- rewind simulation ---------- */
  var GAL = null, playTimer = null;
  function initSim() {
    if (!GAL) {
      GAL = [];
      var R = rng(11);
      for (var i = 0; i < 180; i++) {
        var a = R() * Math.PI * 2, d = Math.sqrt(R());
        GAL.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 0.62, s: 0.6 + R() * 1.8, h: R() });
      }
    }
    var inp = $('simT');
    inp.oninput = function () { drawSim(inp.value / 1000); };
    $('simPlay').onclick = function () {
      if (playTimer) { return; }
      var v = inp.value > 20 ? +inp.value : 1000;
      playTimer = window.setInterval(function () {
        v -= 12;
        if (v <= 0) { v = 0; window.clearInterval(playTimer); playTimer = null; }
        inp.value = v; drawSim(v / 1000);
      }, 30);
    };
    drawSim(inp.value / 1000);
  }
  function drawSim(t) {
    var cv = $('simCv'); if (!cv) { return; }
    var c = cv.getContext('2d'), W = cv.width, H = cv.height, cx = W / 2, cy = H / 2;
    c.fillStyle = '#0F1628'; c.fillRect(0, 0, W, H);
    var sc = Math.max(t, 0.004), R = W * 0.47 * sc;
    var glow = t < 0.2 ? (0.2 - t) / 0.2 : 0;
    if (glow > 0) {
      var g = c.createRadialGradient(cx, cy, 0, cx, cy, W * 0.5);
      g.addColorStop(0, 'rgba(255,214,150,' + (0.95 * glow) + ')');
      g.addColorStop(0.35, 'rgba(238,138,108,' + (0.55 * glow) + ')');
      g.addColorStop(1, 'rgba(15,22,40,0)');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
    for (var i = 0; i < GAL.length; i++) {
      var p = GAL[i];
      var red = Math.round(170 + 85 * p.h * t), gr = Math.round(190 + 40 * (1 - p.h)), bl = Math.round(255 - 110 * p.h * t);
      c.fillStyle = 'rgb(' + red + ',' + gr + ',' + bl + ')';
      c.globalAlpha = 0.85;
      c.beginPath(); c.arc(cx + p.x * R, cy + p.y * R, p.s * (0.7 + 0.6 * t), 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
    var lbl = $('simLbl');
    if (lbl) {
      if (t >= 0.999) { lbl.textContent = 'Now'; }
      else if (t <= 0.001) { lbl.textContent = 'About 13.8 billion years ago · the beginning'; }
      else { lbl.textContent = 'Back about  ' + Math.round(138 * (1 - t)) + ' 00 million years (illustrative)'; }
    }
  }

  /* ---------- share card ---------- */
  function wrapText(c, text, maxW) {
    var lines = [], cur = '';
    var toks = /[\u4e00-\u9fff]/.test(text) ? text.split('') : text.split(/(?=\s)/);
    for (var i = 0; i < toks.length; i++) {
      var ch = toks[i];
      if (!cur) { ch = ch.replace(/^\s+/, ''); }

          var d = null; try { d = JSON.parse(x.responseText); } catch (e) { d = x.responseText; }
          var r = extractReply(d);
          finish(r, r ? '' : 'empty');
        } else { retry('http ' + x.status); }
      };
      x.onerror = function () { retry('network'); };
      x.ontimeout = function () { retry('timeout'); };
      try { x.send(payload); } catch (e) { retry('network'); }
    }
    function retry(why) { if (tries >= delays.length) { finish('', why); return; } window.setTimeout(attempt, delays[tries++]); }
    attempt();
  }

        catch (err) { toast('Could not copy; press and hold the text to copy it'); }

      }
    };
